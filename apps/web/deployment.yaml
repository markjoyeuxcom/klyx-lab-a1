apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'if [ "$MODE" = "crash" ]; then echo "fatal: mode $MODE is not one web supports" >&2; exit 1; fi; echo "web started in mode $MODE"; while true; do sleep 3600; done'
          env:
            - name: MODE
              value: steady
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
